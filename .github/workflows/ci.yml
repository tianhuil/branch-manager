name: CI

on:
  pull_request:
    branches: [staging, production]
  push:
    branches: [staging, production]

jobs:
  lint-and-check-src:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run typecheck

      - name: Run linter
        run: bun run lint

      - name: Run formatter
        run: bun run format

      - name: Run spell
        run: bun run spell

      - name: Run unit tests
        run: bun run test:unit
