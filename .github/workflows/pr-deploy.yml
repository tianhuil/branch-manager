# This GitHub Action workflow automates the lifecycle of preview database branches
# and syncs them with Vercel Preview Deployments for each pull request.
#
# On PR open/reopen/synchronize:
# 1. A new preview database is created.
# 2. Drizzle schema is migrated to the new database.
# 3. A branch-specific DATABASE_URL is set in Vercel.
# 4. A Vercel redeployment is triggered to use the new variable.
# 5. A comment is posted to the PR with environment details.
#
# On PR close/merge:
# 1. The Vercel environment variable is removed.
# 2. The preview database is deleted.

name: Preview Database & Vercel for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  manage-preview-env:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Repository (for dotenvx)
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Extract secrets
        id: secrets
        run: |
          echo "::add-mask::$DOTENV_PRIVATE_KEY_CI"

          VERCEL_TOKEN=$(bun dotenvx get VERCEL_TOKEN --quiet -f .env.ci -f .env)
          echo "::add-mask::$VERCEL_TOKEN"
          echo "VERCEL_TOKEN=$VERCEL_TOKEN" >> $GITHUB_OUTPUT

          VERCEL_PROJECT_ID=$(bun dotenvx get VERCEL_PROJECT_ID --quiet -f .env.ci -f .env)
          echo "VERCEL_PROJECT_ID=$VERCEL_PROJECT_ID" >> $GITHUB_OUTPUT

          VERCEL_ORG_ID=$(bun dotenvx get VERCEL_ORG_ID --quiet -f .env.ci -f .env)
          echo "VERCEL_ORG_ID=$VERCEL_ORG_ID" >> $GITHUB_OUTPUT

          DB_PASSWORD_SEED=$(bun dotenvx get DB_PASSWORD_SEED --quiet -f .env.ci -f .env)
          echo "::add-mask::$DB_PASSWORD_SEED"
          echo "DB_PASSWORD_SEED=$DB_PASSWORD_SEED" >> $GITHUB_OUTPUT

          DB_HOST=$(bun dotenvx get DB_HOST --quiet -f .env.ci -f .env)
          echo "DB_HOST=$DB_HOST" >> $GITHUB_OUTPUT

          ROOT_DATABASE_URL=$(bun dotenvx get ROOT_DATABASE_URL --quiet -f .env.ci -f .env)
          echo "::add-mask::$ROOT_DATABASE_URL"
          echo "ROOT_DATABASE_URL=$ROOT_DATABASE_URL" >> $GITHUB_OUTPUT
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Check if the staging schema is up to date
        # The combination of --verbose and --strict makes this command
        # prompt the user before making any changes to the database. Since
        # GitHub actions is not interactive, the step will immediately end.
        run: echo "$(bun --cwd web drizzle-kit push --verbose --strict --config ./drizzle.config.ts)" >> $GITHUB_OUTPUT
        id: check_schema
        env:
          DATABASE_URL: ${{ steps.secrets.outputs.ROOT_DATABASE_URL }}

      - name: Create Preview Database if necessary and get URL
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        id: db_url_step
        run: |
          check_schema_output="${{ steps.check_schema.outputs.result }}"
          
          # Check if output ends with "No changes detected" ('*' is wildcard)
          if [[ "$check_schema_output" == *"No changes detected" ]]; then
            echo "No schema changes detected. Using the root database"
            DATABASE_URL=${{ steps.secrets.outputs.ROOT_DATABASE_URL }}
          else
            echo "Schema changes detected. Creating a new preview database"
            bun run bm -- preview create \
              --branch-name "${{ github.head_ref }}"
  
            DATABASE_URL=$(bun run bm -- preview url \
              --branch-name "${{ github.head_ref }}")
            echo "::add-mask::$DATABASE_URL"
          
            bun --cwd web drizzle-kit push
            # Also can run DB seed code here...
          fi
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_OUTPUT
        env:
          DB_PASSWORD_SEED: ${{ steps.secrets.outputs.DB_PASSWORD_SEED }}
          ROOT_DATABASE_URL: ${{ steps.secrets.outputs.ROOT_DATABASE_URL }}
          DB_HOST: ${{ steps.secrets.outputs.DB_HOST }}

      - name: Update Preview Database URL and trigger Vercel redeployment
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: |
          # Add DATABASE_URL for the specific Git branch using Vercel CLI
          echo "${{ steps.db_url_step.outputs.DATABASE_URL }}" | \
            bun vercel env add DATABASE_URL preview "${{ github.head_ref }}" \
            --token "${{ steps.secrets.outputs.VERCEL_TOKEN }}" \
            --force

          # Trigger a new deployment for the PR's branch using Vercel CLI
          bun vercel deploy \
            --token "${{ steps.secrets.outputs.VERCEL_TOKEN }}" \
            --yes \
            --no-wait \
            --prod
        env:
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ steps.secrets.outputs.VERCEL_ORG_ID }}

      - name: Post Environment Details to PR
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `${{ github.head_ref }}`;

            const body = `
            ### 🌿 Preview Database & Vercel Deployed

            A new preview database has been created and a Vercel preview deployment for \`${branchName}\` has been triggered.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # --- Cleanup Steps on PR Close ---

      - name: Remove Vercel Preview Environment Variable
        if: github.event.action == 'closed'
        run: |
          # Remove DATABASE_URL for the specific Git branch using Vercel CLI
          bun vercel env rm DATABASE_URL preview "${{ github.head_ref }}" \
            --token "${{ steps.secrets.outputs.VERCEL_TOKEN }}" \
            --yes \
            || echo "Environment variable not found or already deleted"
        env:
          VERCEL_PROJECT_ID: ${{ steps.secrets.outputs.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ steps.secrets.outputs.VERCEL_ORG_ID }}

      - name: Delete Preview Database
        if: github.event.action == 'closed'
        run: |
          bun run bm -- preview delete \
            --branch-name "${{ github.head_ref }}"
        env:
          DB_PASSWORD_SEED: ${{ steps.secrets.outputs.DB_PASSWORD_SEED }}
          ROOT_DATABASE_URL: ${{ steps.secrets.outputs.ROOT_DATABASE_URL }}

      - name: Comment on PR Close
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `${{ github.head_ref }}`;
            const body = `### 🌿 Vercel & Preview Database Cleanup Complete\n\nThe Vercel environment variable has been removed and the preview database for \`${branchName}\` has been deleted.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
