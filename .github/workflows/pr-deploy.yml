# This GitHub Action workflow automates the lifecycle of preview database branches
# and syncs them with Vercel Preview Deployments for each pull request.
#
# On PR open/reopen/synchronize:
# 1. A new preview database is created.
# 2. Drizzle schema is migrated to the new database.
# 3. A branch-specific DATABASE_URL is set in Vercel.
# 4. A Vercel redeployment is triggered to use the new variable.
# 5. A comment is posted to the PR with environment details.
#
# On PR close/merge:
# 1. The Vercel environment variable is removed.
# 2. The preview database is deleted.

name: Preview Database & Vercel for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  manage-preview-env:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Repository (for dotenvx)
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Extract Vercel token
        id: secrets
        run: |
          echo "::add-mask::$DOTENV_PRIVATE_KEY_CI"

          VERCEL_TOKEN=$(bun dotenvx get VERCEL_TOKEN -f .env.ci)
          echo "::add-mask::$VERCEL_TOKEN"
          echo "vercel_token=$VERCEL_TOKEN" >> $GITHUB_OUTPUT
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Create Preview Database
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        run: |
          bun dotenvx run -f .env.ci -- \
            bun run ./script/db-branch/index.ts preview create \
            --branch-name "${{ github.head_ref }}"
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Get Preview Database URL
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        id: db_url_step
        run: |
          DATABASE_URL=$(bun dotenvx run -f .env.ci -- \
            bun run ./script/db-branch/index.ts preview url \
            --branch-name "${{ github.head_ref }}")
          echo "::add-mask::$DATABASE_URL"
          echo "db_url=$DATABASE_URL" >> $GITHUB_OUTPUT
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Run Drizzle Migrate
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: bun drizzle-kit push
        env:
          DATABASE_URL: ${{ steps.db_url_step.outputs.db_url }}

      - name: Set Vercel Preview Environment Variable
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: |
          # Add DATABASE_URL for the specific Git branch using Vercel CLI
          echo "${{ steps.db_url_step.outputs.db_url }}" | \
            bun dotenvx run -f .env.ci -- \
              bun vercel env add DATABASE_URL preview "${{ github.head_ref }}" \
              --token "${{ steps.secrets.outputs.vercel_token }}" \
              --force
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Trigger Vercel Redeployment
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: |
          # Trigger a new deployment for the PR's branch using Vercel CLI
          bun dotenvx run -f .env.ci -- \
            bun vercel deploy \
            --token "${{ steps.secrets.outputs.vercel_token }}" \
            --yes \
            --no-wait \
            --prod
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      # Step 5: Post environment details to the PR
      - name: Post Environment Details to PR
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `${{ github.head_ref }}`;

            const body = `
            ### 🌿 Preview Database & Vercel Deployed

            A new preview database has been created and a Vercel preview deployment for \`${branchName}\` has been triggered.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # --- Cleanup Steps on PR Close ---

      - name: Remove Vercel Preview Environment Variable
        if: github.event.action == 'closed'
        run: |
          # Remove DATABASE_URL for the specific Git branch using Vercel CLI
          bun dotenvx run -f .env.ci -- \
            bun vercel env rm DATABASE_URL preview "${{ github.head_ref }}" \
            --token "${{ steps.secrets.outputs.vercel_token }}" \
            --yes \
            || echo "Environment variable not found or already deleted"
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Delete Preview Database
        if: github.event.action == 'closed'
        run: |
          bun dotenvx run -f .env.ci -- \
            bun run ./script/db-branch/index.ts preview delete \
            --branch-name "${{ github.head_ref }}"
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      - name: Comment on PR Close
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `${{ github.head_ref }}`;
            const body = `### 🌿 Vercel & Preview Database Cleanup Complete\n\nThe Vercel environment variable has been removed and the preview database for \`${branchName}\` has been deleted.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
