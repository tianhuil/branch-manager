# This GitHub Action workflow automates the lifecycle of Neon database branches
# and syncs them with Vercel Preview Deployments for each pull request.
#
# On PR open/reopen/synchronize:
# 1. A new Neon DB branch is created.
# 2. Drizzle schema is migrated to the new branch.
# 3. A branch-specific DATABASE_URL is set in Vercel.
# 4. A Vercel redeployment is triggered to use the new variable.
# 5. A comment is posted to the PR with environment details.
#
# On PR close/merge:
# 1. The Vercel environment variable is removed.
# 2. The Neon DB branch is deleted.

name: Neon & Vercel for PRs

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  manage-preview-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (for dotenvx)
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dotenvx
        run: bun install

      - name: Extract and output secrets
        id: secrets
        run: |
          echo "::add-mask::$DOTENV_PRIVATE_KEY_CI"

          NEON_API_KEY=$(bun dotenvx get NEON_API_KEY -f .env.ci)
          VERCEL_PROJECT_ID=$(bun dotenvx get VERCEL_PROJECT_ID -f .env.ci)
          VERCEL_TOKEN=$(bun dotenvx get VERCEL_TOKEN -f .env.ci)

          echo "vercel_project_id=$VERCEL_PROJECT_ID" >> $GITHUB_OUTPUT

          # For sensitive values, mask them in logs
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$VERCEL_TOKEN"
          echo "neon_api_key=$NEON_API_KEY" >> $GITHUB_OUTPUT
          echo "vercel_token=$VERCEL_TOKEN" >> $GITHUB_OUTPUT
        env:
          DOTENV_PRIVATE_KEY_CI: ${{ secrets.DOTENV_PRIVATE_KEY_CI }}

      # Step 1: Create a Neon branch
      - name: Create Neon Branch
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        id: create_branch
        run: |
          bun neon branches create --name "${{ github.head_ref }}" --api-key "${{ steps.secrets.outputs.neon_api_key }}"
          bun neon roles create --name "${{ github.head_ref }}" --branch "${{ github.head_ref }}" --api-key "${{ steps.secrets.outputs.neon_api_key }}"
          DATABASE_URL=$(bun neon connection-string --branch "${{ github.head_ref }}" --role-name "${{ github.head_ref }}" --api-key "${{ steps.secrets.outputs.neon_api_key }}")
          echo "::add-mask::$DATABASE_URL"
          echo "db_proxy_url=$DATABASE_URL" >> $GITHUB_OUTPUT

      # Step 2: Run Drizzle migrations
      - name: Run Drizzle Migrate
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: bun run db:push
        env:
          DATABASE_URL: ${{ steps.create_branch.outputs.db_url }}

      # Step 3: Set Vercel Environment Variable for the Preview branch
      - name: Set Vercel Preview Environment Variable
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: |
          # Add DATABASE_URL for the specific Git branch using Vercel CLI
          echo "${{ steps.create_branch.outputs.db_proxy_url }}" | bun vercel env add DATABASE_URL preview "${{ github.head_ref }}" \
            --token "${{ steps.secrets.outputs.vercel_token }}" \
            --scope "${{ steps.secrets.outputs.vercel_project_id }}" \
            --force

      # Step 4: Trigger a Vercel redeployment to use the new environment variable
      - name: Trigger Vercel Redeployment
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
        run: |
          # Trigger a new deployment for the PR's branch using Vercel CLI
          bun vercel deploy \
            --token "${{ steps.secrets.outputs.vercel_token }}" \
            --scope "${{ steps.secrets.outputs.vercel_project_id }}" \
            --yes

      # Step 5: Post environment details to the PR
      - name: Post Environment Details to PR
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const proxyUrl = `${{ steps.create_branch.outputs.db_proxy_url }}`;
            const webAccessUrl = `${{ steps.create_branch.outputs.db_web_access_url }}`;

            const body = `
            ### 🌿 Neon Database & Vercel Preview Ready

            A new database branch has been created and a Vercel preview deployment has been triggered.

            **Neon DB Connection URL:**
            \`\`\`
            ${proxyUrl}
            \`\`\`
            *This URL has been set as the \`DATABASE_URL\` for the Vercel deployment.*

            [View DB Branch in Neon Console](${webAccessUrl})
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # --- Cleanup Steps on PR Close ---

      # Step 6: Remove the Vercel Environment Variable
      - name: Remove Vercel Preview Environment Variable
        if: github.event.action == 'closed'
        run: |
          # Remove DATABASE_URL for the specific Git branch using Vercel CLI
          bun vercel env rm DATABASE_URL preview "${{ github.head_ref }}" \
            --token "${{ steps.secrets.outputs.vercel_token }}" \
            --scope "${{ steps.secrets.outputs.vercel_project_id }}" \
            --yes || echo "Environment variable not found or already deleted"

      # Step 7: Delete the Neon Branch
      - name: Delete Neon Branch
        if: github.event.action == 'closed'
        run: |
          bun neon roles delete --name "${{ github.head_ref }}" --branch "${{ github.head_ref }}" --api-key "${{ steps.secrets.outputs.neon_api_key }}"
          bunneon branches delete --name "${{ github.head_ref }}" --api-key "${{ steps.secrets.outputs.neon_api_key }}"

      # Step 8: Comment on PR Close
      - name: Comment on PR Close
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `${{ github.head_ref }}`;
            const body = `### 🌿 Vercel & Neon Cleanup Complete\n\nThe Vercel environment variable has been removed and the Neon database branch \`${branchName}\` has been deleted.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
